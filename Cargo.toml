[workspace]
resolver = "3"
members = ["crates/write-doc", "crates/write-api", "crates/silicon-write-client", "crates/write-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/teamofsilicons/silicon-write"
rust-version = "1.90"

[workspace.dependencies]
yrs = { version = "0.28", features = ["sync"] }
silicon-accounts-client = "0.6"
axum = { version = "0.8", features = ["ws", "macros"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "macros", "migrate"] }
comrak = { version = "0.56", default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "multipart", "query"] }
tower-http = { version = "0.7", features = ["cors", "trace", "limit"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
rand = "0.10"
base64 = "0.23"
dissimilar = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures = "0.3"
bytes = "1"
url = "2"
percent-encoding = "2"
tempfile = "3"

[profile.dev]
debug = 0
